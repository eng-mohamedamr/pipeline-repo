name: Day-2
run-name: ${{ github.actor }}
env:
  APP_NAME: temperature
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      python-version:
        default: '3.13'
        type: choice
        options:
          - '3.13'
          - '3.12'

      create-package:
        required: true
        default: true
        type: boolean

  schedule:
    - cron: '0 7 * * 1'
jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
             - uses: actions/checkout@v3
             - uses: actions/setup-python@v4
               with:
                 python-version: ${{ inputs.python-version }}
          
             - name: install the app
               run:  pip install -r requirements-dev.txt
             - name: test the app
               run: pytest -v
    package:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        if: ${{github.event_name != 'workflow_dispatch' ||inputs.create-package == true}}
        
        steps:
             - uses: actions/checkout@v3  

             - name: calculate the version
               id: version
               run: echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT" 
             - name: package the app
               run: tar -czvf "${APP_NAME}-${steps.version.outputs.version}.tar.gz" -- *
             - name: Upload artifact
               uses: actions/upload-artifact@v4
               with:
                name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
                path: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.tar.gz
                needs: test
        outputs:
            version: ${{ steps.version.outputs.version }}        
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
                - uses : actions/download-artifact@v4
                  with:
                    name: ${{ env.APP_NAME }}-${{ needs.package.outputs.version }}
                    path: ${{ env.APP_NAME }}-${{ needs.package.outputs.version }}.tar.gz
                - name: verify the app
                  run: ls -l
        needs: package
                     
    report:
        runs-on: ubuntu-latest
        steps:
            - name: Print Upstream Job Statuses
              run: |
                echo "====================================="
                echo "       UPSTREAM JOB RESULTS          "
                echo "====================================="
                echo " Test Job Status      : ${{ needs.test.result }}"
                echo "package Job Status    : ${{ needs.package.result }}"
                echo "Verify Job Status     : ${{ needs.verify.result }}"
                echo "====================================="
        if: always() 
        needs: 
            - package
            - test

                