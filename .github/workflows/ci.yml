name: Day-2
run-name: ${{ github.actor }}
env:
  APP_NAME: temperature
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      python-version:
        default: '3.13'
        type: choice
        options:
          - '3.13'
          - '3.12'

      create-package:
        required: true
        default: true
        type: boolean

  schedule:
    - cron: '0 7 * * 1'
jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
             - uses: actions/checkout@v6
             - uses: actions/setup-python@v4
               with:
                 python-version: ${{ inputs.python-version }}
                 cache: pip
                 cache-dependency-path: requirements-dev.txt
              
          
             - name: install the app
               run:  pip install -r requirements-dev.txt

             - name: Run tests and generate JUnit report
               run: |
                  mkdir -p reports
                  pytest -v --junitxml=reports/junit.xml
             - name: Upload test report
               if: ${{ always() }}
               uses: actions/upload-artifact@v4
               with:
                  name: test-report
                  path: reports/junit.xml
                  retention-days: 5
                  if-no-files-found: warn
             - name: Debug Sonar context
               run: |
                echo "Event: $GITHUB_EVENT_NAME"
                echo "Ref: $GITHUB_REF"
                echo "SHA: $GITHUB_SHA"
                git branch --show-current
                git remote -v

             - name: SonarQube Scan
               uses: SonarSource/sonarqube-scan-action@v6
               env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                              
    package:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        if: ${{github.event_name != 'workflow_dispatch' ||inputs.create-package == true}}
        
        steps:
             - uses: actions/checkout@v6 
             - name: calculate the version
               id: version
               run: echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT" 
             - name: package the app
               run: tar -czvf "${APP_NAME}-${{steps.version.outputs.version}}.tar.gz" -- *
             - name: Upload artifact
               uses: actions/upload-artifact@v4
               with:
                name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
                path: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.tar.gz
        needs: test
        outputs:
            version: ${{ steps.version.outputs.version }}        
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:

                - uses : actions/download-artifact@v4
                  with:
                    name: ${{ env.APP_NAME }}-${{ needs.package.outputs.version }}
                    path: ${{ env.APP_NAME }}-${{ needs.package.outputs.version }}.tar.gz
                - name: Extract package
                  env:
                    VERSION: ${{ needs.package.outputs.version }}
                  run: |
                    mkdir -p extracted
                    tar -xzf "${APP_NAME}-${VERSION}.tar.gz" -C extracted

                - name: Verify packaged application
                  working-directory: extracted
                  run: |
                    python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"
        needs: package
                                
    
    report:
      if: ${{ always() }}
      needs: 
        - test
        - package
      runs-on: ubuntu-latest

      steps:
        - name: Write workflow summary
          env:
            APP_NAME: ${{ env.APP_NAME }}
            VERSION: ${{ needs.package.outputs.version }}
            COMMIT_SHA: ${{ github.sha }}
            EVENT_NAME: ${{ github.event_name }}
            TEST_RESULT: ${{ needs.test.result }}
            PACKAGE_RESULT: ${{ needs.package.result }}
          run: |
                { 

                echo "## Workflow Report"
                echo ""
                echo "| Field | Value |"
                echo "|---|---|"
                echo "| App name | ${APP_NAME} |"
                echo "| Version | ${VERSION} |"
                echo "| Commit | ${COMMIT_SHA} |"
                echo "| Event | ${EVENT_NAME} |"
                echo "| Test result | ${TEST_RESULT} |"
                echo "| Package result | ${PACKAGE_RESULT} |"
                echo "| Report generated at | $(date) |"
                } >> "$GITHUB_STEP_SUMMARY"

                  