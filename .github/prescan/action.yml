
name: Custom Pre-Scan
description: Git leaks, TruffleHog, and Trivy filesystem security scans

runs:
  using: composite
  steps:
    - name: Git Leaks Scan
      shell: bash
      run: |
        echo "Starting Git leaks scan..."

        if git grep -n -I -E \
          '(password|passwd|secret|api[_-]?key|access[_-]?token)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{4,}["'\'']' \
          -- . ':!*.md'; then
          echo "::error::Potential hardcoded secret detected!"
          exit 1
        else
          status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::Git leaks scan failed to execute."
            exit "$status"
          fi
          echo "Git leaks scan passed."
        fi

    - name: TruffleHog Scan
      shell: bash
      run: |
        echo "Starting TruffleHog scan..."

        trufflehog git file://. \
          --only-verified \
          --fail

        echo "TruffleHog scan passed."

    - name: Trivy Filesystem Scan
      shell: bash
      run: |
        echo "Starting Trivy filesystem scan..."

        trivy fs \
          --scanners vuln,secret,misconfig \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          .

        echo "Trivy filesystem scan passed."